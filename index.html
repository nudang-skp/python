<style>
:root{
  --bg:#eef3f8; --card:#ffffff; --ink:#10233f; --muted:#5a6b80; --line:#d6e0ea;
  --navy:#0d2f6b; --blue:#2563ad; --teal:#1aa0a0; --green:#2f8f3a; --amber:#b86f0e; --rose:#c9384f;
  --soft:#e6f4f2; --soft2:#e8eff9; --sun:#fff4dc; --lockbg:#f2f5f9; --lockink:#8796a8;
  --shadow:0 1px 2px rgba(16,35,63,.06),0 6px 18px rgba(16,35,63,.07);
  --display:"Mitr","IBM Plex Sans Thai",sans-serif; --body:"IBM Plex Sans Thai","Noto Sans Thai",Tahoma,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#07111d; --card:#0f1d30; --ink:#e6eef7; --muted:#9fb1c6; --line:#24384f;
  --navy:#9cc0ff; --blue:#6aa3ff; --teal:#3cc7c2; --green:#6cc977; --amber:#f0b04f; --rose:#f08196;
  --soft:#12302f; --soft2:#152742; --sun:#33290f; --lockbg:#0c1828; --lockink:#6d8199;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07111d; --card:#0f1d30; --ink:#e6eef7; --muted:#9fb1c6; --line:#24384f;
  --navy:#9cc0ff; --blue:#6aa3ff; --teal:#3cc7c2; --green:#6cc977; --amber:#f0b04f; --rose:#f08196;
  --soft:#12302f; --soft2:#152742; --sun:#33290f; --lockbg:#0c1828; --lockink:#6d8199;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-text-size-adjust:100%}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 28px}
button{font:inherit;color:inherit}
a{color:inherit}

/* header */
.hero{position:relative;display:flex;gap:20px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:20px 24px;box-shadow:var(--shadow);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,var(--navy),var(--blue),var(--teal))}
.chibi{flex:none;width:118px;height:112px;background:var(--img-chibi) center/contain no-repeat;transform-origin:50% 90%;animation:wig 4.5s ease-in-out infinite}
@keyframes wig{0%,84%,100%{transform:rotate(0)}88%{transform:rotate(-4deg)}92%{transform:rotate(3deg)}96%{transform:rotate(-1.5deg)}}
@media (prefers-reduced-motion: reduce){.chibi{animation:none}}
.hero-text{flex:1;min-width:0}
.eyebrow{margin:0;font:500 13px/1.4 var(--display);letter-spacing:.04em;color:var(--teal)}
h1{margin:2px 0 4px;font:600 clamp(22px,3.4vw,30px)/1.25 var(--display);color:var(--navy)}
.sub{margin:0;color:var(--muted);font-size:15px}
.progress{margin-top:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar{flex:1;min-width:160px;height:10px;border-radius:99px;background:var(--soft2);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--blue));transition:width .6s ease}
.progress b{font:500 14px var(--display);color:var(--ink);white-space:nowrap}
.current{margin-left:auto;display:inline-flex;align-items:center;gap:8px;text-decoration:none;background:var(--navy);color:#fff;
  border-radius:12px;padding:9px 16px;font:500 15px var(--display);white-space:nowrap}
:root[data-theme="dark"] .current{color:#07111d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .current{color:#07111d}}
.current:hover{filter:brightness(1.1)}
.current[hidden]{display:none}

/* teacher bar */
.tbar{margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--sun);border:1px dashed var(--amber);
  border-radius:14px;padding:10px 14px;font-size:14px}
.tbar[hidden]{display:none}
.tbar .who{font:500 14px var(--display);color:var(--amber)}
.tbar .src{color:var(--muted);flex:1;min-width:200px}
.tbar .src.bad{color:var(--rose)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:10px;
  padding:6px 12px;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.cfg{flex-basis:100%;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cfg[hidden]{display:none}
.cfg code{font:13px var(--mono);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;overflow-x:auto;max-width:100%}

/* chapter grid */
.grid{list-style:none;margin:18px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ch{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:16px 16px 14px;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
.ch.open:hover{transform:translateY(-2px);border-color:var(--blue)}
.ch.now{border:2px solid var(--teal);padding:15px 15px 13px}
.top{display:flex;gap:12px;align-items:flex-start}
.ico{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--soft2)}
.ico svg{width:34px;height:34px}
.meta{min-width:0;flex:1}
.wk{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font:500 13px/1.4 var(--display);color:var(--blue)}
.tag{font:500 12px/1 var(--display);border-radius:99px;padding:4px 8px}
.tag.now{background:var(--soft);color:var(--teal)}
.tag.exam{background:var(--sun);color:var(--amber)}
.tag.peek{background:var(--sun);color:var(--amber)}
.ch h2{margin:2px 0 0;font:500 18px/1.35 var(--display);color:var(--ink)}
.topics{margin:10px 0 0;color:var(--muted);font-size:14px;line-height:1.6}
.note{margin:10px 0 0;font-size:14px;color:var(--amber);background:var(--sun);border-radius:10px;padding:6px 10px}
.note:empty{display:none}
.foot{margin-top:auto;padding-top:12px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.slides{font-size:13px;color:var(--muted)}
.go{display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:var(--blue);color:#fff;border-radius:10px;padding:7px 14px;font:500 14px var(--display)}
:root[data-theme="dark"] .go{color:#07111d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .go{color:#07111d}}
.go::after{content:"→";transition:transform .15s}
.ch.open:hover .go::after{transform:translateX(3px)}
.go.peek{background:var(--amber)}
.ch a.cover{position:absolute;inset:0;border-radius:16px;z-index:1}
.ch a.cover:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.ch .go{position:relative;z-index:2}

.ch.locked{background:var(--lockbg);box-shadow:none}
.ch.locked .ico{background:transparent;border:1px dashed var(--line)}
.ch.locked .ico svg{filter:grayscale(1);opacity:.35}
.ch.locked h2{color:var(--lockink)}
.ch.locked .wk{color:var(--lockink)}
.ch.locked .topics{color:var(--lockink)}
.lockmsg{display:inline-flex;align-items:center;gap:6px;font:500 14px var(--display);color:var(--lockink)}
.lockmsg svg{width:16px;height:16px}
.ch.locked.peekable{border-style:dashed;border-color:var(--amber)}

/* teacher toggle (config mode) */
.sw{position:relative;z-index:2;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.sw input{appearance:none;width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .2s}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked{background:var(--teal)}
.sw input:checked::after{transform:translateX(14px)}

.pagefoot{margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.linkbtn{background:none;border:0;padding:4px 6px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:5px;border-radius:8px}
.linkbtn:hover{color:var(--ink);background:var(--card)}
.linkbtn svg{width:14px;height:14px}

/* pin dialog */
.modal{position:fixed;inset:0;background:rgba(7,17,29,.45);display:grid;place-items:center;padding:16px;z-index:10}
.modal[hidden]{display:none}
.box{width:min(340px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.box h3{margin:0 0 4px;font:500 18px var(--display)}
.box p{margin:0 0 12px;color:var(--muted);font-size:14px}
.box input{width:100%;font:500 20px var(--mono);letter-spacing:.12em;text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.box .err{color:var(--rose);font-size:13px;min-height:20px;margin:6px 0 0}
.box .row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}

.loading .grid{opacity:.5}
@media (max-width:560px){
  .hero{flex-direction:column;align-items:flex-start;padding:18px 16px;gap:8px}
  .chibi{position:absolute;right:8px;top:10px;width:74px;height:70px}
  .hero-text{width:100%}
  .eyebrow,h1,.sub{padding-right:76px}
  .current{margin-left:0;width:100%;justify-content:center}
  .grid{grid-template-columns:1fr}
}
</style>
</head>

  <div class="tbar" id="tbar" hidden>

    <button class="btn" id="logout" type="button">ออกจากโหมดครู</button>

      <span>เลือกบทด้วยสวิตช์บนการ์ด แล้วคัดลอกบรรทัดนี้ไปแทนบรรทัด <b>open</b> ในไฟล์:</span>

  <ol class="grid" id="grid"></ol>

  <footer class="pagefoot">

    <button class="linkbtn" id="tbtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span>สำหรับครู</span></button>

</div>

<div class="modal" id="modal" hidden>
  <form class="box" id="pinform" autocomplete="off">
    <h3>เข้าโหมดครู</h3>

    <input id="pin" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="รหัสครู">
    <div class="err" id="pinerr"></div>
    <div class="row">
      <button class="btn" type="button" id="cancel">ยกเลิก</button>
      <button class="btn primary" type="submit">เข้าสู่โหมดครู</button>
    </div>
  </form>
</div>

    });
  }

  function cellVal(c) { return c == null ? null : (c.v != null ? c.v : (c.f != null ? c.f : null)); }
  function truthy(v) {
    if (v === true) return true;
    if (v == null || v === false) return false;
    if (typeof v === "number") return v > 0;
    return /^(true|yes|y|1|x|✓|✔|☑|เปิด|เปิดแล้ว)$/i.test(String(v).trim());
  }

  function parseSheet(res) {
    if (!res || res.status === "error" || !res.table) throw new Error("bad");
    var cols = (res.table.cols || []).map(function (c) { return String(c.label || "").trim(); });
    var iOpen = cols.findIndex(function (l) { return /^เปิด|open/i.test(l); });
    var iNote = cols.findIndex(function (l) { return /หมายเหตุ|note/i.test(l); });
    if (iOpen < 0) iOpen = 2;
    if (iNote < 0) iNote = 3;
    var iKey = cols.findIndex(function (l) { return /รหัส|key/i.test(l); });
    var open = [], notes = {}, keys = {}, seen = 0;
    (res.table.rows || []).forEach(function (r) {
      var c = r.c || [];
      var n = parseInt(cellVal(c[0]), 10);
      if (!(n >= 1 && n <= CHAPTERS.length)) return;
      seen++;
      if (truthy(cellVal(c[iOpen]))) open.push(n);
      var note = cellVal(c[iNote]);
      if (note != null && String(note).trim()) notes[n] = String(note).trim();
      var key = iKey >= 0 ? cellVal(c[iKey]) : null;
      if (key != null && String(key).trim()) keys[n] = String(key).trim();
    });
    if (!seen) throw new Error("empty");
    return { open: open, notes: notes, keys: keys };
  }

  function refresh() {
    if (!sheetId()) { render(); return Promise.resolve(); }
    return loadSheet().then(parseSheet).then(function (d) {
      setOpenList(d.open); state.notes = d.notes; state.keys = d.keys; state.source = "sheet"; state.sheetError = ""; state.updated = new Date();
      store("sheet", { open: d.open, notes: d.notes, keys: d.keys, at: Date.now() });
    }).catch(function (e) {
      var cached = store("sheet");
      state.sheetError = e && e.message === "empty" ? "empty" : "fail";
      if (state.source === "sheet") state.source = "cache";
      else if (state.source !== "cache") {
        if (cached && cached.open) { setOpenList(cached.open); state.notes = cached.notes || {}; state.keys = cached.keys || {}; state.source = "cache"; state.updated = new Date(cached.at); }
        else { setOpenList(CONFIG.open); state.notes = {}; state.source = "config"; }
      }
    }).then(render);
  }

  /* ---------- render ---------- */
  function isOpen(n) {
    if (state.draft) return !!state.draft[n];
    return !!state.open[n];
  }
  function teacherOn() { return state.teacher && !state.studentView; }

  function render() {
    $("app").classList.remove("loading");
    var total = CHAPTERS.length, opened = 0, latest = 0;
    CHAPTERS.forEach(function (ch) { if (isOpen(ch.n)) { opened++; latest = Math.max(latest, ch.n); } });
    $("bar").querySelector("i").style.width = (opened / total * 100) + "%";
    $("bar").setAttribute("aria-valuenow", opened);
    $("count").textContent = opened ? "เปิดแล้ว " + opened + " จาก " + total + " บท" : "ยังไม่เปิดบทเรียน";

    var cur = $("current");
    if (latest) {
      var lc = CHAPTERS[latest - 1];
      cur.href = slideUrl(lc, true);
      cur.textContent = "เรียนบทล่าสุด: บทที่ " + latest + " →";
      cur.hidden = false;
    } else cur.hidden = true;

    var configMode = teacherOn() && !sheetId();
    var html = CHAPTERS.map(function (ch) {
      var open = isOpen(ch.n), peek = !open && teacherOn();
      var cls = "ch " + (open ? "open" : "locked") + (open && ch.n === latest ? " now" : "") + (peek ? " peekable" : "");
      var tags = "";
      if (open && ch.n === latest) tags += '<span class="tag now">บทล่าสุด</span>';
      if (ch.exam) tags += '<span class="tag exam">เตรียมสอบ</span>';
      if (peek) tags += '<span class="tag peek">นักเรียนยังไม่เห็น</span>';
      var url = esc(slideUrl(ch, open));
      var label = "บทที่ " + ch.n + " " + ch.title;
      var foot;
      if (open) foot = '<span class="slides">' + ch.slides + ' หน้า</span><a class="go" href="' + url + '" target="_blank" rel="noopener" tabindex="-1">เปิดสไลด์</a>';
      else if (peek) foot = '<span class="lockmsg">' + LOCK + 'ปิดอยู่</span><a class="go peek" href="' + url + '" target="_blank" rel="noopener" tabindex="-1">ครูเปิดดู</a>';
      else foot = '<span class="lockmsg">' + LOCK + 'ครูยังไม่เปิดบทนี้</span>';
      if (configMode) foot = '<label class="sw"><input type="checkbox" data-n="' + ch.n + '"' + (open ? " checked" : "") + '>ให้นักเรียนเห็น</label>' + foot.replace(/<span class="(slides|lockmsg)">[\s\S]*?<\/span>/, "");
      var cover = (open || peek) ? '<a class="cover" href="' + url + '" target="_blank" rel="noopener" aria-label="เปิดสไลด์ ' + esc(label) + '"></a>' : "";
      return '<li class="' + cls + '"' + (open || peek ? "" : ' aria-label="' + esc(label) + ' (ยังไม่เปิด)"') + '>' + cover +
        '<div class="top"><div class="ico">' + ICONS[ch.n - 1] + '</div><div class="meta">' +
        '<div class="wk">สัปดาห์ที่ ' + ch.n + tags + '</div><h2>' + esc(ch.title) + '</h2></div></div>' +
        '<p class="topics">' + esc(ch.topics) + '</p>' +
        '<p class="note">' + (state.notes[ch.n] ? esc(state.notes[ch.n]) : "") + '</p>' +
        '<div class="foot">' + foot + '</div></li>';
    }).join("");
    $("grid").innerHTML = html;

    // teacher bar
    $("tbar").hidden = !state.teacher;
    $("viewstu").textContent = state.studentView ? "กลับโหมดครู" : "ดูแบบนักเรียน";
    var src = $("src"), msg = "", bad = false;
    if (sheetId()) {
      var nokey = CHAPTERS.filter(function (c) { return state.open[c.n] && !state.keys[c.n]; }).map(function (c) { return c.n; });
      if (state.source === "sheet" && nokey.length) { bad = true; msg = "บทที่ " + nokey.join(", ") + " เปิดแล้วแต่ยังไม่ได้ใส่รหัสบทใน Sheet นักเรียนจะเจอหน้าล็อก"; }
      else if (state.source === "sheet") msg = "ควบคุมด้วย Google Sheet · ติ๊กช่อง \"เปิด\" และใส่รหัสบท แล้วนักเรียนจะเห็นภายใน " + CONFIG.refreshSeconds + " วินาที";
      else { bad = true; msg = (state.sheetError === "empty" ? "Sheet ไม่มีแถวบทที่ 1–10 " : "อ่าน Sheet ไม่ได้ (ตรวจว่าแชร์แบบทุกคนที่มีลิงก์ดูได้) ") + (state.source === "cache" ? "· ใช้ค่าล่าสุดที่เคยอ่านได้" : "· ใช้ค่า open ในไฟล์แทน"); }
      $("sheetlink").href = sheetEditUrl(); $("sheetlink").hidden = false;
    } else {
      msg = "ควบคุมด้วยค่า open ในไฟล์ (ยังไม่ได้เชื่อม Google Sheet)";
      $("sheetlink").hidden = true;
    }
    src.textContent = msg; src.className = "src" + (bad ? " bad" : "");
    $("cfg").hidden = !configMode;
    if (configMode) $("cfgline").textContent = "open: [" + CHAPTERS.filter(function (c) { return isOpen(c.n); }).map(function (c) { return c.n; }).join(", ") + "],";
    $("updated").textContent = state.updated && state.source !== "config" ? "อัปเดตสถานะบท " + state.updated.toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" }) + " น." : "";
    $("tbtn").hidden = state.teacher;
  }

  /* ---------- teacher mode ---------- */
  function openPin() { $("modal").hidden = false; $("pin").value = ""; $("pinerr").textContent = ""; setTimeout(function () { $("pin").focus(); }, 30); }
  $("tbtn").onclick = openPin;
  $("cancel").onclick = function () { $("modal").hidden = true; };
  $("modal").addEventListener("click", function (e) { if (e.target === this) this.hidden = true; });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") $("modal").hidden = true; });
  $("pinform").onsubmit = function (e) {
    e.preventDefault();
    if ($("pin").value.trim().toLowerCase() === String(CONFIG.teacherPin).trim().toLowerCase()) {
      state.teacher = true; state.studentView = false; sstore("teacher", "1"); $("modal").hidden = true; render();
    } else { $("pinerr").textContent = "รหัสไม่ถูกต้อง"; $("pin").select(); }
  };
  $("logout").onclick = function () { state.teacher = false; state.studentView = false; state.draft = null; sstore("teacher", null); render(); };
  $("viewstu").onclick = function () { state.studentView = !state.studentView; render(); };
  $("grid").addEventListener("change", function (e) {
    var t = e.target; if (!t.matches || !t.matches(".sw input")) return;
    if (!state.draft) { state.draft = {}; CHAPTERS.forEach(function (c) { state.draft[c.n] = !!state.open[c.n]; }); }
    state.draft[t.getAttribute("data-n")] = t.checked; render();
  });
  $("copy").onclick = function () {
    var text = $("cfgline").textContent, b = this;
    function ok() { b.textContent = "คัดลอกแล้ว"; setTimeout(function () { b.textContent = "คัดลอก"; }, 1500); }
    function fallback() { var r = document.createRange(); r.selectNodeContents($("cfgline")); var s = getSelection(); s.removeAllRanges(); s.addRange(r); try { document.execCommand("copy"); ok(); } catch (e) { b.textContent = "กด Ctrl+C"; } }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
  };

  /* ---------- start ---------- */
  setOpenList(CONFIG.open);
  if (sheetId()) {
    var cached = store("sheet");
    if (cached && cached.open) { setOpenList(cached.open); state.notes = cached.notes || {}; state.keys = cached.keys || {}; state.source = "cache"; state.updated = new Date(cached.at); render(); }
    refresh();
    var every = Math.max(20, +CONFIG.refreshSeconds || 60) * 1000;
    setInterval(function () { if (!document.hidden) refresh(); }, every);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(); });
  } else render();
})();
</script>
</body>
</html>
