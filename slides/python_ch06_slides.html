<meta name="viewport" content="width=device-width, initial-scale=1">
<title>input ตัวเลขและการแปลงชนิด · สัปดาห์ที่ 6</title>
<style>
:root{--bg:#eef3f8;--card:#fff;--ink:#10233f;--muted:#5a6b80;--line:#d6e0ea;--blue:#2563ad;--rose:#c9384f}
@media (prefers-color-scheme: dark){:root{--bg:#07111d;--card:#0f1d30;--ink:#e6eef7;--muted:#9fb1c6;--line:#24384f;--blue:#6aa3ff;--rose:#f08196;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans Thai","Noto Sans Thai",Tahoma,sans-serif}
body{display:grid;place-items:center;min-height:100vh;padding:16px}
.box{width:min(380px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px;text-align:center}
.box[hidden]{display:none}
svg{width:44px;height:44px;color:var(--muted)}
h1{margin:8px 0 2px;font:600 20px/1.35 "Mitr","IBM Plex Sans Thai",sans-serif}
p{margin:0 0 14px;color:var(--muted);font-size:15px}
form{display:flex;gap:8px}
input{flex:1;min-width:0;font:500 18px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-align:center;text-transform:uppercase;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
button{font:500 15px "Mitr","IBM Plex Sans Thai",sans-serif;border:0;border-radius:10px;padding:9px 16px;background:var(--blue);color:#fff;cursor:pointer}
.err{min-height:22px;margin:8px 0 0;color:var(--rose);font-size:14px}
#wait{color:var(--muted)}
</style>
</head>

  <h1>บทที่ 6 ยังไม่เปิด</h1>
  <p>ครูจะเปิดบทนี้เมื่อถึงเวลาเรียน ให้เข้าจากหน้าเมนูรายวิชา หรือใส่รหัสบทที่ครูให้</p>
  <form id="f" autocomplete="off">
    <input id="k" placeholder="XXXX-XXXX" aria-label="รหัสบท" autocapitalize="characters" spellcheck="false">
    <button type="submit">เปิด</button>
  </form>
  <div class="err" id="err"></div>
</div>
