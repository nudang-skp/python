<style>
:root{--bg:#eef3f8;--card:#fff;--ink:#10233f;--muted:#5a6b80;--line:#d6e0ea;--blue:#2563ad;--rose:#c9384f}

*{box-sizing:border-box}

  function norm(k) { return String(k || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); }
  function get() { try { return localStorage.getItem(STORE); } catch (e) { return null; } }
  function put(k) { try { localStorage.setItem(STORE, k); } catch (e) {} }
  function b64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  var data = b64(BLOB);
  function unlock(k) {
    var c = window.crypto && crypto.subtle;
    if (!c) return Promise.reject(new Error("nocrypto"));
    var enc = new TextEncoder().encode(norm(k));
    return c.importKey("raw", enc, "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return c.deriveKey({ name: "PBKDF2", salt: data.slice(0, 16), iterations: ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    }).then(function (key) {
      return c.decrypt({ name: "AES-GCM", iv: data.slice(16, 28) }, key, data.slice(28));
    }).then(function (buf) { return new TextDecoder().decode(buf); });
  }
  function show(html, k) {
    put(norm(k));
    document.open(); document.write(html); document.close();
  }
  function locked(msg) {
    document.getElementById("wait").hidden = true;
    document.getElementById("lock").hidden = false;
    document.getElementById("err").textContent = msg || "";
  }
  var fromUrl = (location.search.match(/[?&]k=([^&#]*)/) || [])[1];
  var tries = [];
  if (fromUrl) tries.push(decodeURIComponent(fromUrl));
  if (get()) tries.push(get());
  (function next(i) {
    if (i >= tries.length) return locked(fromUrl ? "รหัสบทในลิงก์ไม่ถูกต้อง" : "");
    unlock(tries[i]).then(function (html) { show(html, tries[i]); }, function (e) {

      next(i + 1);
    });
  })(0);
  document.getElementById("f").onsubmit = function (e) {

    var k = document.getElementById("k").value;
    if (!norm(k)) return;
    document.getElementById("err").textContent = "กำลังตรวจ…";
